[package]
name = "charm-watch"
version = "0.1.0"
edition = "2021"
description = "charm idle-detector: reads tmux pane activity + ticket bodies and reports which interactive agents have finished but not reported."

[[bin]]
name = "charm-watch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
